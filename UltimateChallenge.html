<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Challenge - Rohan's Arcade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Bungee&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #020617; color: #f1f5f9; }
        canvas#arena { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        .spice-font { font-family: 'Bungee Spice', cursive; }
        .logo-font { font-family: 'Bungee', cursive; }

        #overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .interactive { pointer-events: auto; }

        .boom-text {
            font-family: 'Bungee Spice', cursive;
            text-align: center;
            line-height: 1.05;
            text-shadow: 0 0 40px rgba(244,114,182,0.5), 0 8px 0 rgba(0,0,0,0.4);
            animation: boomIn 0.5s cubic-bezier(0.18,0.89,0.32,1.28);
        }
        @keyframes boomIn { from { transform: scale(2.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .pulse { animation: pulseGlow 0.6s ease-in-out infinite; }

        .hud-top { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: space-between; padding: 16px 24px; }
        .player-badge { background: rgba(15,23,42,0.8); backdrop-filter: blur(10px); border-radius: 18px; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
        .pip.on { box-shadow: 0 0 12px currentColor; }
        .p1-color { color: #38bdf8; }
        .p2-color { color: #f472b6; }

        #minigame-panel {
            position: fixed; inset: 0; z-index: 60;
            display: flex; align-items: center; justify-content: center;
            background: rgba(2,6,23,0.55); backdrop-filter: blur(8px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #minigame-panel.show { opacity: 1; pointer-events: auto; }

        .mg-card { background: #0f172a; border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px rgba(0,0,0,0.6); padding: 32px; width: min(640px, 92vw); text-align: center; }

        .key-cap { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; background: #1e293b; border: 2px solid #334155; font-family: 'Bungee', cursive; font-size: 18px; box-shadow: 0 4px 0 #0b1220; }
        .key-cap.active { background: currentColor; color: #020617 !important; transform: translateY(3px); box-shadow: 0 1px 0 #0b1220; }

        .tug-bar { height: 28px; border-radius: 14px; overflow: hidden; display: flex; }
        .tug-fill-p1 { background: linear-gradient(90deg,#0ea5e9,#38bdf8); transition: flex 0.05s linear; }
        .tug-fill-p2 { background: linear-gradient(90deg,#f472b6,#db2777); transition: flex 0.05s linear; }

        .btn-primary { background: #db2777; color: white; font-family: 'Bungee', cursive; padding: 16px 36px; border-radius: 16px; border-bottom: 4px solid #831843; box-shadow: 0 10px 30px rgba(219,39,119,0.3); transition: all 0.15s; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(2px); border-bottom-width: 1px; }

        .countdown-num { font-family: 'Bungee Spice', cursive; font-size: 16rem; line-height: 1; text-shadow: 0 0 60px rgba(251,191,36,0.6); }

        .result-banner { font-family: 'Bungee', cursive; font-size: 3rem; }
    </style>
</head>
<body>

<canvas id="arena"></canvas>

<div class="hud-top">
    <div class="player-badge p1-color">
        <span class="logo-font text-lg">P1</span>
        <span class="pip on" style="background:#38bdf8" id="pip1-1"></span>
        <span class="pip on" style="background:#38bdf8" id="pip1-2"></span>
    </div>
    <div class="spice-font text-xl md:text-2xl text-white opacity-70">ULTIMATE CHALLENGE</div>
    <div class="player-badge p2-color" style="flex-direction: row-reverse">
        <span class="logo-font text-lg">P2</span>
        <span class="pip on" style="background:#f472b6" id="pip2-1"></span>
        <span class="pip on" style="background:#f472b6" id="pip2-2"></span>
    </div>
</div>

<div id="overlay"></div>

<div id="minigame-panel">
    <div class="mg-card">
        <div id="mg-title" class="spice-font text-3xl text-pink-400 mb-2">GAME</div>
        <div id="mg-instr" class="text-slate-300 text-sm mb-6"></div>
        <div id="mg-body"></div>
        <div id="mg-status" class="logo-font text-2xl mt-6 opacity-0"></div>
    </div>
</div>

<script>
// ===== 3D ARENA =====
let scene, camera, renderer, p1Mesh, p2Mesh, ring, stars = [];
let clock = new THREE.Clock();

function initArena() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.035);

    camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, 7, 16);
    camera.lookAt(0, 1.5, 0);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('arena'), antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;

    scene.add(new THREE.HemisphereLight(0x3b82f6, 0x020617, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(5, 14, 8); dl.castShadow = true; scene.add(dl);
    const pl1 = new THREE.PointLight(0x38bdf8, 1.5, 30); pl1.position.set(-6, 4, 2); scene.add(pl1);
    const pl2 = new THREE.PointLight(0xf472b6, 1.5, 30); pl2.position.set(6, 4, 2); scene.add(pl2);

    // Floor
    const floor = new THREE.Mesh(new THREE.CircleGeometry(18, 64), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7, metalness: 0.2 }));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

    // Glowing ring
    ring = new THREE.Mesh(new THREE.TorusGeometry(7, 0.15, 16, 80), new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xfbbf24, emissiveIntensity: 0.8 }));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.05; scene.add(ring);

    // Two contenders (capsule-ish)
    p1Mesh = makeFighter(0x38bdf8, -5);
    p2Mesh = makeFighter(0xf472b6, 5);
    scene.add(p1Mesh, p2Mesh);

    // Stars
    const sg = new THREE.SphereGeometry(0.08, 6, 6);
    const sm = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let i = 0; i < 200; i++) {
        const s = new THREE.Mesh(sg, sm);
        s.position.set((Math.random()-0.5)*120, Math.random()*40+5, (Math.random()-0.5)*120);
        scene.add(s); stars.push(s);
    }

    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    animateArena();
}

function makeFighter(color, x) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.7, 1.2, 8, 16), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.25, roughness: 0.4 }));
    body.position.y = 1.3; body.castShadow = true; g.add(body);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    eye.position.set(0, 1.7, 0.6); g.add(eye);
    g.position.set(x, 0, 0);
    g.userData = { baseY: 0, body };
    return g;
}

function animateArena() {
    requestAnimationFrame(animateArena);
    const t = clock.getElapsedTime();
    [p1Mesh, p2Mesh].forEach((f, i) => {
        f.position.y = Math.abs(Math.sin(t * 2 + i * Math.PI)) * 0.4;
        f.rotation.y = Math.sin(t * 0.6 + i) * 0.3;
        f.userData.body.scale.y = 1 + Math.abs(Math.sin(t * 2 + i * Math.PI)) * 0.05;
    });
    ring.rotation.z += 0.005;
    ring.material.emissiveIntensity = 0.6 + Math.sin(t * 3) * 0.3;
    stars.forEach(s => { s.position.y += 0.02; if (s.position.y > 45) s.position.y = 5; });
    renderer.render(scene, camera);
}

// ===== BOOMING VOICE =====
const voice = window.speechSynthesis;
let boomVoice = null;
function loadVoice() {
    const vs = voice.getVoices();
    boomVoice = vs.find(v => /en-GB|en_US|Google US|male|Daniel|Alex/i.test(v.name + v.lang)) || vs[0];
}
if (voice) { loadVoice(); voice.onvoiceschanged = loadVoice; }

function boom(text, opts = {}) {
    const card = document.getElementById('overlay');
    const el = document.createElement('div');
    el.className = 'boom-text ' + (opts.size || 'text-6xl md:text-8xl') + ' ' + (opts.color || 'text-yellow-300');
    el.innerText = text;
    card.innerHTML = ''; card.appendChild(el);
    if (voice && boomVoice) {
        try {
            const u = new SpeechSynthesisUtterance(text.replace(/[^a-zA-Z0-9 ]/g, ''));
            u.voice = boomVoice; u.pitch = opts.pitch || 0.3; u.rate = opts.rate || 0.7; u.volume = 1;
            voice.cancel(); voice.speak(u);
        } catch(e) {}
    }
}

// ===== GAME FLOW =====
const overlay = document.getElementById('overlay');
const panel = document.getElementById('minigame-panel');
const mgTitle = document.getElementById('mg-title');
const mgInstr = document.getElementById('mg-instr');
const mgBody = document.getElementById('mg-body');
const mgStatus = document.getElementById('mg-status');

let p1Wins = 0, p2Wins = 0, roundsPlayed = 0;
const TARGET = 2; // best of 3

const MINIGAMES = [
    { id: 'mash', title: 'BUTTON MASH', instr: 'Press your key as FAST as you can for 5 seconds!', run: runMash },
    { id: 'draw', title: 'QUICK DRAW', instr: 'Wait for GO... then press first!', run: runDraw },
    { id: 'tug', title: 'TUG OF WAR', instr: 'Alternate your two keys to pull the rope!', run: runTug },
    { id: 'react', title: 'COLOR REACT', instr: 'Press when the panel turns GREEN. Fake-outs possible!', run: runReact }
];

function showOverlay(html) { overlay.innerHTML = html; }
function clearOverlay() { overlay.innerHTML = ''; }

async function startChallenge() {
    boom('THE ULTIMATE CHALLENGE', { size: 'text-5xl md:text-7xl', color: 'text-pink-400' });
    await wait(2200);
    boom('WILL BEGIN IN', { size: 'text-4xl md:text-6xl', color: 'text-white' });
    await wait(1600);
    for (const n of ['THREE', 'TWO', 'ONE']) {
        boom(n, { size: 'countdown-num text-yellow-300', rate: 0.6 });
        await wait(1100);
    }
    boom('THINK OF GAMES', { size: 'text-5xl md:text-7xl', color: 'text-pink-400 pulse', rate: 0.75 });
    await wait(1800);
    clearOverlay();
    await runRound();
}

async function runRound() {
    const game = MINIGAMES[Math.floor(Math.random() * MINIGAMES.length)];
    mgTitle.innerText = game.title;
    mgInstr.innerHTML = game.instr;
    mgBody.innerHTML = '';
    mgStatus.classList.add('opacity-0');
    panel.classList.add('show');
    await wait(800);
    await game.run();
}

function endRound(winner) {
    panel.classList.remove('show');
    roundsPlayed++;
    const name = winner === 1 ? 'PLAYER 1' : 'PLAYER 2';
    if (winner === 1) { p1Wins++; const pip = document.getElementById('pip1-' + p1Wins); if (pip) pip.style.opacity = '0.2'; }
    else { p2Wins++; const pip = document.getElementById('pip2-' + p2Wins); if (pip) pip.style.opacity = '0.2'; }
    boom(name + ' WINS!', { size: 'text-5xl md:text-7xl', color: winner === 1 ? 'text-cyan-300' : 'text-pink-300', rate: 0.7 });
    setTimeout(async () => {
        clearOverlay();
        if (p1Wins >= TARGET || p2Wins >= TARGET) {
            const champ = p1Wins > p2Wins ? 'PLAYER 1' : 'PLAYER 2';
            boom('CHAMPION: ' + champ, { size: 'text-4xl md:text-6xl', color: 'text-yellow-300', rate: 0.65 });
            setTimeout(() => showRestart(), 3000);
        } else {
            await runRound();
        }
    }, 2200);
}

function showRestart() {
    overlay.innerHTML = `<div class="interactive text-center"><div class="boom-text text-3xl md:text-4xl text-white mb-8">CHAMPION CROWNED</div><button class="btn-primary" onclick="resetMatch()">PLAY AGAIN</button></div>`;
}

window.resetMatch = function() {
    p1Wins = 0; p2Wins = 0; roundsPlayed = 0;
    [1,2].forEach(p => [1,2].forEach(i => { const pip = document.getElementById('pip'+p+'-'+i); if (pip) pip.style.opacity = '1'; }));
    clearOverlay();
    startChallenge();
};

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function showStatus(text, color) {
    mgStatus.innerText = text;
    mgStatus.style.color = color || '#fff';
    mgStatus.classList.remove('opacity-0');
}

function keyCap(label, color, active) {
    return `<span class="key-cap ${active ? 'active' : ''}" style="color:${color}">${label}</span>`;
}

// ===== MINIGAME: BUTTON MASH =====
async function runMash() {
    mgBody.innerHTML = `
        <div class="flex justify-around items-center mb-6">
            <div class="p1-color"><div class="text-xs font-black uppercase mb-2">Player 1</div>${keyCap('A','#38bdf8')}</div>
            <div class="p2-color"><div class="text-xs font-black uppercase mb-2">Player 2</div>${keyCap('L','#f472b6')}</div>
        </div>
        <div class="flex gap-4 h-40 items-end justify-center">
            <div class="w-20 bg-cyan-500/20 rounded-t-lg flex items-end overflow-hidden" style="height:100%"><div id="bar1" class="w-full bg-cyan-400" style="height:0%;transition:height 0.05s"></div></div>
            <div class="w-20 bg-pink-500/20 rounded-t-lg flex items-end overflow-hidden" style="height:100%"><div id="bar2" class="w-full bg-pink-400" style="height:0%;transition:height 0.05s"></div></div>
        </div>
        <div id="mash-timer" class="logo-font text-4xl text-yellow-400 mt-4">5</div>`;
    let c1 = 0, c2 = 0, timeLeft = 5, running = true;
    const handler = (e) => {
        if (!running) return;
        if (e.code === 'KeyA') c1++;
        if (e.code === 'KeyL') c2++;
    };
    addEventListener('keydown', handler);
    const timerEl = document.getElementById('mash-timer');
    const iv = setInterval(() => {
        timeLeft -= 0.1; timerEl.innerText = Math.max(0, timeLeft).toFixed(1);
        document.getElementById('bar1').style.height = Math.min(100, c1) + '%';
        document.getElementById('bar2').style.height = Math.min(100, c2) + '%';
        if (timeLeft <= 0) { clearInterval(iv); running = false; removeEventListener('keydown', handler); }
    }, 100);
    await wait(5200);
    endRound(c1 >= c2 ? 1 : 2);
}

// ===== MINIGAME: QUICK DRAW =====
async function runDraw() {
    mgBody.innerHTML = `
        <div class="flex justify-around items-center mb-8">
            <div class="p1-color"><div class="text-xs font-black uppercase mb-2">Player 1</div>${keyCap('A','#38bdf8')}</div>
            <div class="p2-color"><div class="text-xs font-black uppercase mb-2">Player 2</div>${keyCap('L','#f472b6')}</div>
        </div>
        <div id="draw-light" class="w-48 h-48 mx-auto rounded-full bg-red-500 flex items-center justify-center text-5xl">WAIT</div>`;
    showStatus('Get ready...', '#fbbf24');
    await wait(1500 + Math.random() * 2500);
    const light = document.getElementById('draw-light');
    light.className = 'w-48 h-48 mx-auto rounded-full bg-green-500 flex items-center justify-center text-5xl pulse';
    light.innerText = 'GO!';
    showStatus('PRESS NOW!', '#10b981');
    let winner = 0;
    const handler = (e) => {
        if (winner) return;
        if (e.code === 'KeyA') winner = 1;
        if (e.code === 'KeyL') winner = 2;
    };
    addEventListener('keydown', handler);
    // false start window
    if (!winner) { await wait(2500); }
    removeEventListener('keydown', handler);
    if (!winner) { showStatus('No one drew!', '#ef4444'); await wait(1000); winner = Math.random() < 0.5 ? 1 : 2; }
    endRound(winner);
}

// ===== MINIGAME: TUG OF WAR =====
async function runTug() {
    mgBody.innerHTML = `
        <div class="flex justify-around items-center mb-6">
            <div class="p1-color text-left"><div class="text-xs font-black uppercase mb-2">P1: alternate</div><div class="flex gap-1">${keyCap('A','#38bdf8')}${keyCap('S','#38bdf8')}</div></div>
            <div class="p2-color text-right"><div class="text-xs font-black uppercase mb-2">P2: alternate</div><div class="flex gap-1">${keyCap('K','#f472b6')}${keyCap('L','#f472b6')}</div></div>
        </div>
        <div class="tug-bar mb-4">
            <div id="tug1" class="tug-fill-p1" style="flex:50"></div>
            <div id="tug2" class="tug-fill-p2" style="flex:50"></div>
        </div>
        <div id="tug-marker" class="text-3xl">🪢</div>`;
    let pos = 50; // 0 = p1 wins, 100 = p2 wins
    let p1Last = null, p2Last = null;
    const handler = (e) => {
        if (e.code === 'KeyA' && p1Last !== 'A') { p1Last = 'A'; pos -= 4; }
        if (e.code === 'KeyS' && p1Last !== 'S') { p1Last = 'S'; pos -= 4; }
        if (e.code === 'KeyK' && p2Last !== 'K') { p2Last = 'K'; pos += 4; }
        if (e.code === 'KeyL' && p2Last !== 'L') { p2Last = 'L'; pos += 4; }
        pos = Math.max(0, Math.min(100, pos));
        document.getElementById('tug1').style.flex = pos;
        document.getElementById('tug2').style.flex = 100 - pos;
    };
    addEventListener('keydown', handler);
    const decay = setInterval(() => { pos = Math.max(0, Math.min(100, pos + (pos < 50 ? -0.3 : 0.3))); document.getElementById('tug1').style.flex = pos; document.getElementById('tug2').style.flex = 100 - pos; }, 100);
    let done = false;
    while (!done) {
        await wait(100);
        if (pos <= 0 || pos >= 100) done = true;
    }
    clearInterval(decay); removeEventListener('keydown', handler);
    endRound(pos <= 0 ? 1 : 2);
}

// ===== MINIGAME: COLOR REACT =====
async function runReact() {
    mgBody.innerHTML = `
        <div class="flex justify-around items-center mb-6">
            <div class="p1-color"><div class="text-xs font-black uppercase mb-2">Player 1</div>${keyCap('A','#38bdf8')}</div>
            <div class="p2-color"><div class="text-xs font-black uppercase mb-2">Player 2</div>${keyCap('L','#f472b6')}</div>
        </div>
        <div id="react-light" class="w-48 h-48 mx-auto rounded-3xl bg-slate-700 flex items-center justify-center text-3xl font-black">READY</div>
        <p class="text-xs text-slate-400 mt-4">Only press on GREEN. Red = false start!</p>`;
    const light = document.getElementById('react-light');
    let winner = 0, active = false;
    const handler = (e) => {
        if (winner) return;
        if (e.code !== 'KeyA' && e.code !== 'KeyL') return;
        if (!active) { // false start
            winner = e.code === 'KeyA' ? 2 : 1; // other player wins
            light.className = 'w-48 h-48 mx-auto rounded-3xl bg-red-600 flex items-center justify-center text-3xl font-black';
            light.innerText = 'FALSE START!';
            return;
        }
        winner = e.code === 'KeyA' ? 1 : 2;
    };
    addEventListener('keydown', handler);
    for (let round = 0; round < 3 && !winner; round++) {
        light.className = 'w-48 h-48 mx-auto rounded-3xl bg-slate-700 flex items-center justify-center text-3xl font-black';
        light.innerText = 'WAIT...';
        await wait(800 + Math.random() * 1800);
        if (winner) break;
        // occasional fake-out (yellow)
        if (Math.random() < 0.35 && round === 0) {
            light.className = 'w-48 h-48 mx-auto rounded-3xl bg-yellow-500 flex items-center justify-center text-3xl font-black';
            light.innerText = 'NOT YET';
            await wait(700); continue;
        }
        light.className = 'w-48 h-48 mx-auto rounded-3xl bg-green-500 flex items-center justify-center text-3xl font-black pulse';
        light.innerText = 'NOW!';
        active = true;
        await wait(1200);
        active = false;
    }
    removeEventListener('keydown', handler);
    if (!winner) winner = Math.random() < 0.5 ? 1 : 2;
    endRound(winner);
}

// ===== START =====
initArena();
overlay.innerHTML = `<div class="interactive text-center">
    <div class="boom-text text-4xl md:text-6xl text-pink-400 mb-4">2 PLAYER VERSUS</div>
    <div class="text-slate-300 mb-8 max-w-md mx-auto">A booming announcer. A 3D arena. Surprise head-to-head mini-games. First to 2 rounds is champion!</div>
    <div class="flex justify-center gap-8 mb-8 text-sm">
        <div class="p1-color"><div class="font-black uppercase mb-1">Player 1</div><div class="flex gap-1">${keyCap('A','#38bdf8')}${keyCap('S','#38bdf8')}</div></div>
        <div class="p2-color"><div class="font-black uppercase mb-1">Player 2</div><div class="flex gap-1">${keyCap('K','#f472b6')}${keyCap('L','#f472b6')}</div></div>
    </div>
    <button class="btn-primary" onclick="startChallenge()">START THE CHALLENGE</button>
</div>`;
window.startChallenge = startChallenge;
</script>
</body>
</html>
